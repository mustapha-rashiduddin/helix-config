theme = "modus_operandi"

# Per-file cursor position memory across editor sessions.
#
# Helix has no built-in equivalent of Neovim's viminfo, so the position is
# stored by a small helper script and replayed on open by the hx() wrapper
# script in ~/bin.
#
# `save` goes through :pipe-to rather than :sh on purpose: :sh spawns a
# fire-and-forget tokio job that the editor drops on exit, so the write can be
# silently lost. :pipe-to blocks until the child has finished.
#
# %{buffer_name} is single-quoted because the command line is word-split and a
# path containing spaces would otherwise arrive as several arguments.
#
# Positions live in $XDG_STATE_HOME/helix/positions, one file per source file.

[editor]
# Show line numbers relative to the cursor line, which stays absolute.
line-number = "relative"

[keys.normal]
# Quitting is deliberately NOT bound to bare keys. x/X are
# extend_line_below/extend_to_line_bounds (selecting a whole line) and Q is
# record_macro; binding those to save-position-then-quit shadowed the defaults
# and made x quit the editor. :q and :wq need no binding of their own.
":" = [":pipe-to ~/.config/helix/hx-pos.sh save '%{buffer_name}' %{cursor_line} %{cursor_column}", "command_mode"]

# :q and :wq are covered above because everything typed at the prompt passes
# through it. wclose is the one exit that doesn't: C-w q is a keybinding and
# never enters command mode, so closing the last window that way quits with no
# position saved. Nested so this adds to the Window minor mode instead of
# replacing it - C-w stays rotate_view, C-w s/v/t and friends are untouched.
[keys.normal."C-w"]
q = [":pipe-to ~/.config/helix/hx-pos.sh save '%{buffer_name}' %{cursor_line} %{cursor_column}", "wclose"]
"C-q" = [":pipe-to ~/.config/helix/hx-pos.sh save '%{buffer_name}' %{cursor_line} %{cursor_column}", "wclose"]

# Save the position without quitting (useful before :bc, or to checkpoint a
# spot while editing).
"Z" = ":pipe-to ~/.config/helix/hx-pos.sh save '%{buffer_name}' %{cursor_line} %{cursor_column}"

# Switch theme live: C-l light, C-k dark (modus_operandi and amberwood).
#
# C-l and C-k are Helix defaults (jump_view_right / jump_view_up); user
# bindings take precedence, so these deliberately override them.
#
# These call the same config-manager/theme.sh that the `light`/`dark` shell
# aliases call, so the theme propagates in both directions - from a terminal
# into Helix via SIGUSR1, and from Helix back out to st, Neovim, Emacs and
# Chrome. theme.sh rewrites this file's theme line and signals every running
# hx, including this one, so it repaints via the reload rather than needing
# an explicit :theme here.
#
# Not :light / :dark as typable commands: Helix 25.07 has no user-defined
# commands (config.toml accepts only theme/keys/editor, with
# deny_unknown_fields), so keybindings are the only hook available.
"C-l" = ":pipe-to ~/.config/config-manager/theme.sh light"
"C-k" = ":pipe-to ~/.config/config-manager/theme.sh dark"
